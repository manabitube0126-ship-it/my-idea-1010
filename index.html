<!doctype html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AsaPace</title>
<style>
:root{--blue:#1f6fe0;--ink:#1f4e79;--soft:#4f7fae;--bg1:#BFE3FF;--bg2:#EAF6FF;--coral:#e0612f}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(var(--bg1),var(--bg2) 420px,#f5faff);min-height:100vh;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #0b3d91;outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:560px;margin:0 auto;padding:14px 16px 0}
.brand{font-weight:800;font-size:20px;letter-spacing:.02em;color:var(--ink)}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--soft);letter-spacing:0}
.lang{background:#fff;border:2px solid var(--blue);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--soft);display:flex;gap:6px;align-items:center}
.lang span.on{color:var(--blue);font-weight:800}
main{max-width:560px;margin:0 auto;padding:8px 16px 40px}
.hero{text-align:center;position:relative;padding:6px 0 4px}
.sun{position:absolute;right:2px;top:-4px;font-size:40px;animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(5px) rotate(12deg)}}
.lbl{color:var(--soft);font-size:14px;margin-top:6px}
.count{font-size:clamp(56px,19vw,92px);font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0}
.leave{color:var(--soft);font-size:14px}
.leave b{color:var(--ink)}
.bubble{background:#fff;border-radius:20px;padding:14px 16px;margin:16px 0 0;box-shadow:0 3px 12px rgba(31,111,224,.2);display:flex;align-items:center;gap:14px;border:2px solid transparent;transition:border-color .3s}
.bubble.hurry{border-color:var(--coral)}
.bubble .face{font-size:44px;line-height:1}
.bubble .tt{font-weight:800;font-size:18px}
.bubble .ss{font-size:13px;color:var(--soft)}
.sec{margin-top:18px;display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--soft);font-weight:700}
.list{list-style:none;margin:8px 0 0;padding:0}
.row{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px;border:2px solid transparent;position:relative;overflow:hidden}
.row.cur{border-color:var(--blue);font-weight:700}
.row.done{opacity:.5}
.row.done .nm{text-decoration:line-through}
.row .r{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{position:absolute;left:0;bottom:0;height:4px;background:#cfe3ff;width:100%}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s linear}
.mini{border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.big{width:100%;margin-top:6px;background:var(--blue);color:#fff;border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:800;box-shadow:0 4px 0 #1550a8;transition:transform .1s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #1550a8}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sec-btn{flex:1;min-width:140px;background:#fff;border:2px solid var(--blue);color:var(--blue);border-radius:14px;padding:10px;font-weight:700;font-size:14px}
.note{font-size:12px;color:var(--soft);margin-top:8px;text-align:center;min-height:18px}
.card{background:rgba(255,255,255,.9);border-radius:18px;padding:14px 16px;margin-top:20px;box-shadow:0 2px 10px rgba(31,111,224,.12)}
.card h2{font-size:16px;margin:0 0 10px}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-weight:700;font-size:15px}
input[type=time],input[type=text],input[type=number]{border:2px solid #b9d6f5;border-radius:10px;padding:8px 10px;background:#fff;min-width:0}
input[type=text]{flex:1}
input[type=number]{width:64px}
.srow{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #e1eefc;font-size:15px}
.srow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.sq{width:34px;height:34px;border-radius:10px;border:2px solid #b9d6f5;background:#fff;font-weight:800;color:var(--blue);padding:0}
.mm{min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.add{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}
.addbtn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.tot{font-size:13px;color:var(--soft);margin-top:8px}
#msg{min-height:20px;font-size:13px;color:var(--blue);font-weight:700;margin-top:6px}
footer{text-align:center;font-size:12px;color:var(--soft);margin-top:24px}
@media (prefers-reduced-motion:reduce){.sun{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand">AsaPace<small data-i18n="tagline"></small></div>
  <button class="lang" id="langBtn" data-demo="lang-switch" data-i18n-aria="langAria" type="button"><span id="lj">日本語</span>/<span id="le">EN</span></button>
</header>
<main>
  <section class="hero" aria-live="off">
    <div class="sun" aria-hidden="true">☀️</div>
    <div class="lbl" id="cLabel"></div>
    <div class="count" id="count" data-demo="countdown" role="timer">--:--</div>
    <div class="leave" id="leave"></div>
    <div class="leave" id="clock"></div>
  </section>

  <div class="bubble" id="bubble" data-demo="comment-area" aria-live="polite">
    <div class="face" id="face">☀️</div>
    <div><div class="tt" id="bTitle"></div><div class="ss" id="bSub"></div></div>
  </div>

  <div class="sec"><span id="listTitle" data-i18n="doingNow"></span><span id="listTotal"></span></div>
  <ul class="list" id="list" data-demo="task-list"></ul>

  <button class="big" id="mainBtn" type="button"></button>

  <div class="btns">
    <button class="sec-btn" id="demoBtn" data-demo="demo-btn" type="button"></button>
    <button class="sec-btn" id="resetBtn" data-demo="reset-btn" type="button" data-i18n="reset"></button>
  </div>
  <div class="note" id="demoNote"></div>

  <section class="card" aria-labelledby="setH">
    <h2 id="setH" data-i18n="settings"></h2>
    <label class="field"><span data-i18n="departure"></span>
      <input type="time" id="depInput" data-demo="departure-input" value="08:10"></label>
    <div style="font-weight:700;font-size:15px" data-i18n="tasks"></div>
    <div id="settingsList" data-demo="settings-list"></div>
    <div class="tot" id="totLine"></div>
    <form class="add" id="addForm">
      <input type="text" id="newName" data-demo="new-task-name" data-i18n-ph="newPh" maxlength="30" autocomplete="off">
      <input type="number" id="newMin" data-demo="new-task-min" min="1" max="120" value="5" data-i18n-aria="minAria">
      <button class="addbtn" type="submit" data-demo="add-task-btn" data-i18n="add"></button>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>
    <button class="sec-btn" style="width:100%;margin-top:6px" id="defBtn" data-demo="restore-defaults" type="button" data-i18n="restoreDef"></button>
  </section>
  <footer data-i18n="foot"></footer>
</main>

<script>
const I18N={
ja:{
title:"AsaPace｜朝の時間配分タイマー",tagline:"出発から逆算、今やることがひと目で",langAria:"言語を切り替え",
untilLeave:"出発まで",overLabel:"出発時間を過ぎました",untilStart:"次の出発まで",
leaveAt:"家を出るのは <b>{t}</b>",nowIs:"いま {t}",
start:"スタート",next:"できた！次へ",again:"もう一度",skip:"スキップ",reset:"最初から",
demo:"⚡ デモ早送り",demoOff:"リアル時間に戻す",demoNote:"デモ中：時間が20倍速で進みます",
doingNow:"今やること",allDoneTitle:"ぜんぶ完了！",total:"合計 {n}分",left:"あと {m}",
settings:"設定",departure:"出発時間",tasks:"やること",add:"追加",newPh:"例：お弁当を詰める",minAria:"所要時間（分）",
restoreDef:"初期設定に戻す",foot:"AsaPace・朝のバタバタを、ちょっとラクに。",
min:"分",delAria:"削除",minusAria:"1分減らす",plusAria:"1分増やす",
dress:"着替え",breakfast:"朝食",teeth:"歯みがき・洗顔",bag:"持ち物チェック",shoes:"靴をはく",
idleTitle:"準備開始は {t} までに",idleSub:"全部で{n}分。余裕を持ってスタートしよう",
c1:"余裕たっぷり！",c2:"いいペース！",c3:"ぴったり、この調子！",c4:"ちょっと急ごう",c5:"かなり急ぎ！スキップも手だよ",
cLate:"出発の時間です！",cDone:"準備完了！いってらっしゃい",
ahead:"予定より{n}分早いよ",behind:"予定より{n}分遅れてるよ",onplan:"予定どおりだよ",
doneSub:"出発まで {n}分の余裕",lateSub:"{m} 過ぎています",
mAdded:"「{name}」を追加しました",mEmpty:"やることの名前を入れてね",mDef:"初期設定に戻しました",mDemo:"デモ開始！20倍速で進みます"
},
en:{
title:"AsaPace – Morning Time Planner",tagline:"Counts back from departure, so you know what to do now",langAria:"Switch language",
untilLeave:"Time until you leave",overLabel:"You are past departure time",untilStart:"Until next departure",
leaveAt:"Leave home at <b>{t}</b>",nowIs:"Now {t}",
start:"Start",next:"Done! Next",again:"Go again",skip:"Skip",reset:"Start over",
demo:"⚡ Fast demo",demoOff:"Back to real time",demoNote:"Demo: time runs 20× faster",
doingNow:"Doing now",allDoneTitle:"All done!",total:"Total {n} min",left:"{m} left",
settings:"Settings",departure:"Departure time",tasks:"Tasks",add:"Add",newPh:"e.g. Pack lunch",minAria:"Minutes needed",
restoreDef:"Restore defaults",foot:"AsaPace – make hectic mornings a little easier.",
min:"min",delAria:"Delete",minusAria:"1 minute less",plusAria:"1 minute more",
dress:"Get dressed",breakfast:"Breakfast",teeth:"Teeth & face",bag:"Check your bag",shoes:"Put on shoes",
idleTitle:"Start getting ready by {t}",idleSub:"{n} min in total. Start early to stay relaxed.",
c1:"Plenty of time!",c2:"Great pace!",c3:"Right on time!",c4:"Let's hurry a bit",c5:"Rush! Skipping a task could help",
cLate:"Time to leave!",cDone:"All set! Have a great day",
ahead:"{n} min ahead of plan",behind:"{n} min behind plan",onplan:"Right on plan",
doneSub:"{n} min to spare before you leave",lateSub:"{m} over",
mAdded:"Added “{name}”",mEmpty:"Please type a task name",mDef:"Defaults restored",mDemo:"Demo started! Time runs 20× faster"
}};

const DEFAULTS=()=>[
 {id:1,icon:"👕",key:"dress",min:5},
 {id:2,icon:"🍞",key:"breakfast",min:10},
 {id:3,icon:"🪥",key:"teeth",min:3},
 {id:4,icon:"🎒",key:"bag",min:2},
 {id:5,icon:"👟",key:"shoes",min:1}];

const S={lang:"en",dep:"08:10",tasks:DEFAULTS(),running:false,depTs:0,taskStart:0,speed:1,vBase:Date.now(),rBase:Date.now(),nextId:100};
const $=id=>document.getElementById(id);
const vNow=()=>S.vBase+(Date.now()-S.rBase)*S.speed;

function t(k,p){let s=(I18N[S.lang]&&I18N[S.lang][k])??I18N.en[k]??k;
  if(p)for(const x in p)s=s.split("{"+x+"}").join(p[x]);return s}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tname=k=>k.key?t(k.key):k.name;

function initLang(){
  let l=null;
  if(window.APP_LANG==="ja"||window.APP_LANG==="en")l=window.APP_LANG;
  if(!l){try{const q=new URLSearchParams(location.search).get("lang");if(q==="ja"||q==="en")l=q}catch(e){}}
  if(!l){try{const s=localStorage.getItem("lang");if(s==="ja"||s==="en")l=s}catch(e){}}
  S.lang=l||"en";
}
function save(){try{localStorage.setItem("asapace",JSON.stringify({dep:S.dep,tasks:S.tasks.map(x=>({id:x.id,icon:x.icon,key:x.key,name:x.name,min:x.min})),nextId:S.nextId}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem("asapace")||"null");
  if(d&&Array.isArray(d.tasks)&&d.tasks.length){S.dep=/^\d\d:\d\d$/.test(d.dep)?d.dep:S.dep;S.tasks=d.tasks.filter(x=>x&&x.min>0);S.nextId=d.nextId||100}}catch(e){}
  S.tasks.forEach(x=>x.st="todo")}

function fmtT(ts){const d=new Date(ts);return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}
function fmtC(sec){sec=Math.max(0,Math.ceil(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  const p=n=>String(n).padStart(2,"0");return h?h+":"+p(m)+":"+p(s):p(m)+":"+p(s)}
function nextOcc(){const [h,m]=S.dep.split(":").map(Number);const d=new Date(vNow());d.setHours(h,m,0,0);
  if(d.getTime()<=vNow())d.setDate(d.getDate()+1);return d.getTime()}
const totalMin=()=>S.tasks.reduce((a,x)=>a+x.min,0);
const cur=()=>S.tasks.find(x=>x.st==="todo");

function applyLang(){
  document.documentElement.lang=S.lang;document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.i18nAria)));
  $("lj").className=S.lang==="ja"?"on":"";$("le").className=S.lang==="en"?"on":"";
  renderList();renderSettings();update();
}

function renderList(){
  const c=cur();
  $("list").innerHTML=S.tasks.map(x=>{
    const isCur=S.running&&c===x;
    let right;
    if(x.st==="done")right="✓";else if(x.st==="skip")right="—";
    else if(isCur)right='<span id="curLeft"></span><button class="mini" data-demo="skip-btn" data-skip="'+x.id+'" type="button">'+esc(t("skip"))+'</button>';
    else right=x.min+t("min");
    return '<li class="row '+(isCur?"cur ":"")+((x.st!=="todo")?"done":"")+'" data-demo="task-'+x.id+'"><span class="nm">'+x.icon+" "+esc(tname(x))+'</span><span class="r">'+right+'</span>'+(isCur?'<div class="bar"><i id="curBar"></i></div>':"")+'</li>';
  }).join("");
  $("listTotal").textContent=t("total",{n:totalMin()});
  const mb=$("mainBtn");
  if(!S.running){mb.textContent=t("start");mb.dataset.demo="start-btn"}
  else if(c){mb.textContent=t("next");mb.dataset.demo="next-btn"}
  else{mb.textContent=t("again");mb.dataset.demo="again-btn"}
  $("listTitle").textContent=S.running&&!c?t("allDoneTitle"):t("doingNow");
  $("demoBtn").textContent=S.speed>1?t("demoOff"):t("demo");
  $("demoNote").textContent=S.speed>1?t("demoNote"):"";
}

function renderSettings(){
  $("settingsList").innerHTML=S.tasks.map(x=>'<div class="srow"><span>'+x.icon+'</span><span class="nm">'+esc(tname(x))+'</span>'+
   '<button class="sq" type="button" data-demo="minus-'+x.id+'" data-m="'+x.id+'" aria-label="'+esc(t("minusAria"))+'">−</button>'+
   '<span class="mm">'+x.min+t("min")+'</span>'+
   '<button class="sq" type="button" data-demo="plus-'+x.id+'" data-p="'+x.id+'" aria-label="'+esc(t("plusAria"))+'">+</button>'+
   '<button class="sq" type="button" data-demo="del-'+x.id+'" data-d="'+x.id+'" aria-label="'+esc(t("delAria"))+'">🗑</button></div>').join("");
  $("totLine").textContent=t("total",{n:totalMin()});
  $("depInput").value=S.dep;
}

function update(){
  const now=vNow();
  if(!S.running)S.depTs=nextOcc();
  const c=cur(),finished=S.running&&!c;
  const left=(S.depTs-now)/1000;
  $("clock").textContent=t("nowIs",{t:fmtT(now)});
  $("leave").innerHTML=t("leaveAt",{t:fmtT(S.depTs)});
  let hurry=false,face,title,sub;
  if(S.running&&left<=0&&!finished){
    $("cLabel").textContent=t("overLabel");$("count").textContent="+"+fmtC(-left);
  }else{
    $("cLabel").textContent=S.running?t("untilLeave"):t("untilStart");$("count").textContent=fmtC(left);
  }
  const total=S.tasks.filter(x=>x.st==="todo").reduce((a,x)=>a+x.min*60,0);
  let el=0;if(c&&S.running)el=Math.min((now-S.taskStart)/1000,c.min*60);
  const slack=left-(total-el);
  const sm=Math.round(Math.abs(slack)/60);
  if(!S.running){
    face="☀️";title=t("idleTitle",{t:fmtT(S.depTs-total*1000)});sub=t("idleSub",{n:totalMin()});
  }else if(finished){
    face="🎉";title=t("cDone");sub=left>0?t("doneSub",{n:Math.floor(left/60)}):"";
  }else if(left<=0){
    face="🚪";title=t("cLate");sub=t("lateSub",{m:fmtC(-left)});hurry=true;
  }else{
    const m=slack/60;
    if(m>=4){face="😎";title=t("c1")}
    else if(m>=1){face="👍";title=t("c2")}
    else if(m>-1){face="🙂";title=t("c3")}
    else if(m>-4){face="💨";title=t("c4");hurry=true}
    else{face="😱";title=t("c5");hurry=true}
    sub=sm===0?t("onplan"):(slack>0?t("ahead",{n:sm}):t("behind",{n:sm}));
  }
  $("face").textContent=face;$("bTitle").textContent=title;$("bSub").textContent=sub;
  $("bubble").classList.toggle("hurry",hurry);
  const cl=$("curLeft");
  if(cl&&c){cl.textContent=t("left",{m:fmtC(c.min*60-el)});
    const b=$("curBar");if(b)b.style.width=(el/(c.min*60)*100)+"%"}
}

function msg(s){const m=$("msg");m.textContent=s;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent="",2800)}
function resetProgress(){S.running=false;S.tasks.forEach(x=>x.st="todo")}

$("mainBtn").addEventListener("click",()=>{
  if(!S.running){S.depTs=nextOcc();S.running=true;S.taskStart=vNow();S.tasks.forEach(x=>x.st="todo")}
  else{const c=cur();
    if(c){c.st="done";S.taskStart=vNow()}
    else{resetProgress()}}
  renderList();update();
});
$("list").addEventListener("click",e=>{
  const b=e.target.closest("[data-skip]");if(!b)return;
  const x=S.tasks.find(k=>k.id==b.dataset.skip);if(x){x.st="skip";S.taskStart=vNow();renderList();update()}
});
$("resetBtn").addEventListener("click",()=>{resetProgress();renderList();update()});
$("demoBtn").addEventListener("click",()=>{
  if(S.speed>1){S.speed=1;S.vBase=Date.now();S.rBase=Date.now();resetProgress()}
  else{
    resetProgress();S.depTs=nextOcc();
    S.speed=20;S.rBase=Date.now();S.vBase=S.depTs-(totalMin()+4)*60000;
    S.running=true;S.taskStart=S.vBase;S.tasks.forEach(x=>x.st="todo");msg(t("mDemo"));
  }
  renderList();update();
});
$("depInput").addEventListener("input",e=>{if(/^\d\d:\d\d$/.test(e.target.value)){S.dep=e.target.value;
  if(S.running&&S.speed===1){S.depTs=nextOcc()}save();update()}});
$("settingsList").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;const id=+(d.m||d.p||d.d);const x=S.tasks.find(k=>k.id===id);if(!x)return;
  if(d.m)x.min=Math.max(1,x.min-1);
  if(d.p)x.min=Math.min(120,x.min+1);
  if(d.d){if(cur()===x)S.taskStart=vNow();S.tasks=S.tasks.filter(k=>k!==x)}
  save();renderList();renderSettings();update();
});
$("addForm").addEventListener("submit",e=>{
  e.preventDefault();
  const n=$("newName").value.trim();
  if(!n){msg(t("mEmpty"));return}
  let m=parseInt($("newMin").value,10);if(!(m>0))m=5;m=Math.min(120,m);
  const nt={id:S.nextId++,icon:"✅",name:n,min:m,st:"todo"};
  if(S.running&&!cur())S.taskStart=vNow();
  S.tasks.push(nt);$("newName").value="";
  save();renderList();renderSettings();update();msg(t("mAdded",{name:n}));
});
$("defBtn").addEventListener("click",()=>{
  S.tasks=DEFAULTS();S.tasks.forEach(x=>x.st="todo");S.dep="08:10";S.running=false;
  save();renderList();renderSettings();update();msg(t("mDef"));
});
$("langBtn").addEventListener("click",()=>{
  S.lang=S.lang==="ja"?"en":"ja";
  try{localStorage.setItem("lang",S.lang)}catch(e){}
  applyLang();
});

initLang();load();applyLang();
setInterval(update,250);
</script>
</body>
</html>
